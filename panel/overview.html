<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上帝视角 · 果果</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#252a33;--txt:#e6e9ef;--dim:#8b94a3;--ok:#35c97a;--warn:#f2b73d;--bad:#f2545b;--unk:#7a8494}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:18px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:19px;margin:0;font-weight:600}
.meta{color:var(--dim);font-size:12px}
.verdict{margin-left:auto;font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card.bad{border-color:var(--bad)}.card.warn{border-color:var(--warn)}
.h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.ok .dot{background:var(--ok)}.warn .dot{background:var(--warn)}.bad .dot{background:var(--bad)}.unknown .dot{background:var(--unk)}
.h .tag{margin-left:auto;font-size:11px;color:var(--dim);font-weight:400}
ul{margin:6px 0 0;padding-left:16px;color:var(--dim);font-size:12.5px}
li{margin:2px 0}
details summary{cursor:pointer;color:var(--dim);font-size:12px;margin-top:6px;outline:none}
footer{margin-top:16px;color:var(--dim);font-size:11.5px}
</style></head>
<body>
<header>
  <h1>上帝视角</h1>
  <span class="meta" id="ts">加载中…</span>
  <span class="verdict" id="verdict">—</span>
</header>
<div class="grid" id="grid"></div>
<footer>六域指标全部来自真实探针（HTTP / 真实写库 / 文件 mtime / 进程状态）；取不到写「未采集」，不猜。数据 10 分钟刷新一次，本页 60 秒自动重取。</footer>
<script>
const ORDER=['服务','任务','资金','存储','安防','模型'];
const ICON={ok:'🟢',warn:'🟡',bad:'🔴',unknown:'⚪'};
const WORD={ok:'正常',warn:'需注意',bad:'异常',unknown:'未采集'};
async function load(){
  let d;
  try{ d=await (await fetch('/overview-data.json?t='+Date.now(),{cache:'no-store'})).json(); }
  catch(e){ document.getElementById('ts').textContent='数据不可达（'+e.message+'）'; return; }
  document.getElementById('ts').textContent='采集于 '+d.generated_at;
  const s=d.summary||{};
  const v=document.getElementById('verdict');
  v.textContent=(s.verdict==='ok'?'全部正常':s.verdict==='warn'?'有需注意项':'有异常');
  v.style.color=s.verdict==='ok'?'var(--ok)':s.verdict==='warn'?'var(--warn)':'var(--bad)';
  v.style.borderColor=v.style.color;
  const g=document.getElementById('grid'); g.innerHTML='';
  for(const name of ORDER){
    const x=d.domains&&d.domains[name]; if(!x) continue;
    const lv=x.level||'unknown';
    const bad=lv==='bad'||lv==='warn';
    const el=document.createElement('div');
    el.className='card '+lv;
    const det=(x.details||[]).map(t=>'<li>'+String(t).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</li>').join('');
    el.innerHTML='<div class="h '+lv+'"><span class="dot"></span><span>'+name+'</span><span class="tag">'+(x.headline||WORD[lv])+'</span></div>'+
      (bad?('<ul>'+det+'</ul>'):('<details><summary>'+WORD[lv]+' · 展开 '+(x.details||[]).length+' 项</summary><ul>'+det+'</ul></details>'))+
      '<details><summary>数据源：'+(x.source||'-')+'</summary></details>';
    g.appendChild(el);
  }
}
load(); setInterval(load,60000);
</script></body></html>
